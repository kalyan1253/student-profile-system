<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Student Records</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
        h2 { color: #333; }
        .top-links { margin-bottom: 15px; }
        .top-links a { text-decoration: none; color: #0056b3; font-weight: bold; }
        table { width: 100%; table-layout: fixed; word-wrap: break-word; border-collapse: collapse; background: white; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #0056b3; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .btn-edit { color: #0056b3; font-weight: bold; text-decoration: none; }
        .btn-delete { color: #d9534f; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Student Records</h2>
    <p><a href="/add-student">+ Add New Student</a> | <a href="/">Back to Home</a></p>
    <form action="/students" method="get" style="margin-bottom: 15px;">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or roll no..." style="padding: 6px; width: 250px;" />
    <button type="submit" style="padding: 6px 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
    <a href="/students" style="margin-left: 8px;">Reset</a>
</form>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Email</th>
                <th>Course</th>
                <th>Branch</th>
                <th>Attendance (%)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.rollNumber}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.course}"></td>
                <td th:text="${s.branch}"></td>
                <td th:text="${s.attendance}"></td>
                <td>
    <a th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a> | 
    <a th:href="@{/students/delete/{id}(id=${s.id})}" 
       onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
