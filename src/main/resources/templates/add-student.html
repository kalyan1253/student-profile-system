<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Add / Update Student Profile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        form { background: white; padding: 25px; max-width: 400px; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
        button { background: #1e6091; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Add Student Profile</h2>
    <form th:action="@{/save-student}" th:object="${student}" method="post">
        <label>Full Name:</label>
        <input type="text" th:field="*{name}" required />

        <label>Roll Number:</label>
        <input type="text" th:field="*{rollNumber}" required />

        <label>Email:</label>
        <input type="email" th:field="*{email}" required />

        <label>Course (e.g., B.Tech):</label>
        <input type="text" th:field="*{course}" required />

        <label>Branch (e.g., CSE):</label>
        <input type="text" th:field="*{branch}" required />
        <label>Marks / CGPA:</label>
        <input type="text" th:field="*{marks}" placeholder="e.g. 88%" required />

        <label>Attendance (%):</label>
        <input type="text" th:field="*{attendance}" placeholder="e.g. 92%" required />

        <button type="submit">Save Student</button>
    </form>
    <p><a href="/">Back to Home</a> | <a href="/students">View All Records</a></p>
</body>
</html>
