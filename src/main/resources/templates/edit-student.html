<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Edit Student</title>
</head>
<body>
    <h2>Edit Student</h2>
    <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required /><br/><br/>

        <label>Roll Number:</label>
        <input type="text" th:field="*{rollNumber}" required /><br/><br/>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required /><br/><br/>

        <label>Course:</label>
        <input type="text" th:field="*{course}" required /><br/><br/>

        <label>Branch:</label>
        <input type="text" th:field="*{branch}" required /><br/><br/>
        <label>Marks / CGPA:</label>
        <input type="text" th:field="*{marks}" required /><br/><br/>

        <label>Attendance (%):</label>
        <input type="text" th:field="*{attendance}" required /><br/><br/>

        <button type="submit">Update Student</button>
        <a href="/students">Cancel</a>
    </form>
</body>
</html>
