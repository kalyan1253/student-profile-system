<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Academic Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; background: #f4f7f6; }
        h2 { color: #198754; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #198754; color: white; }
        a { color: #0b3c78; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <h2>🎓 Academic Details & Marks</h2>
    <p><a href="/portal">← Back to Services</a></p>
    <form th:action="@{/academics}" method="get" style="margin-bottom: 20px;">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by Roll No, Name, Course, Branch..." style="padding: 5px; width: 300px;" />
        <button type="submit" style="padding: 5px 10px;">Search</button>
        <a th:href="@{/academics}"><button type="button" style="padding: 5px 10px; margin-left: 5px;">Clear</button></a>
    </form>
    <table>
        <thead>
            <tr><th>Roll No</th><th>Student Name</th><th>Course</th><th>Branch</th><th>Marks / CGPA</th></tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.rollNumber}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.course}"></td>
                <td th:text="${s.branch}"></td>
                <td><strong th:text="${s.marks != null ? s.marks : 'Not Updated'}"></strong></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
